# Builds the release web bundle, wraps it in the Capacitor iOS app, signs it with Xcode's cloud signing
# and uploads it to TestFlight. No Mac needed: it runs on GitHub's macOS runners.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com > Account > Membership details)
#   ASC_KEY_ID         App Store Connect API key ID (Users and Access > Integrations > App Store Connect API)
#   ASC_ISSUER_ID      Issuer ID shown above the key list on that same page
#   ASC_PRIVATE_KEY    Full text of the downloaded AuthKey_XXXX.p8 file, including the BEGIN/END lines
# The key needs the Admin role so Xcode can create the distribution certificate and profile for you.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-b1fop0, claude/project-thread-1crnqn]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple secrets
        id: secrets
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing repository secrets:$missing. The app will be compiled unsigned to check it builds, but not uploaded. See the comment at the top of .github/workflows/testflight.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build the release web bundle
        run: |
          npm ci
          npm test
          npm run ios:sync

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile unsigned (no Apple secrets yet)
        if: steps.secrets.outputs.ready != 'true'
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Write API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          echo "Build number $BUILD_NUMBER"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
